[workspace]
members = ["crates/mt-doc", "crates/mt-app"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
mt-doc = { path = "crates/mt-doc" }

# gpui must be specified EXACTLY as gpui-component specifies it (same URL, no
# rev), or Cargo treats them as distinct sources and the graph ends up with two
# incompatible gpui crates. Cargo.lock is what actually pins the revision.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
# Grammars named one at a time, not `tree-sitter-languages`. That feature is
# gpui-component's "everything" switch — 34 generated C parse tables, and they
# are `.rdata` rather than code, which is why the binary's `.rdata` used to be
# larger than its `.text`. Kotlin alone is an 11.9MB static library; C# 11.0MB,
# Swift 8.3MB, C++ 7.4MB, SQL 5.5MB.
#
# Measured on x86_64-pc-windows-msvc: 82,848,000 -> 54,269,952 bytes, **-34.5%**,
# with no code change. `.rdata` alone went 47,887KB -> 17,161KB.
#
# **This list is chosen by what appears in a ``` fence, not by what files the
# app opens.** That distinction is the whole reason the list is not shorter.
# A fenced block inside a Markdown document is highlighted through the same
# grammars: `CodeBlock::styles` -> `SyntaxHighlighter::new(lang)` ->
# `LanguageRegistry::singleton().language(lang)`, and that registry is built
# from `Language::all()` — the same cfg-gated enum. So dropping
# `tree-sitter-rust` does not merely stop highlighting `.rs` files, it renders
# every ```rust block in every README as flat grey text. Counted across this
# repository's Markdown: 8606 ```rust, 77 ```bash, 23 ```toml, 6 ```json,
# 4 ```yaml, 4 ```diff — which is what this list is.
#
# Trimming to `tree-sitter-markdown` alone was measured too: 49,107,456 bytes,
# a further 5.2MB. It is rejected on both counts — the fences go unhighlighted,
# and it does not even compile (see the cfg note below).
#
# Three things to know before editing this list:
#
# * A grammar feature gates the `Language` enum **variant**, not just its
#   highlighting. `#[cfg(feature = "tree-sitter-rust")]` sits on the variant,
#   on its `name()` arm and on its `from_name` arm alike, so removing a feature
#   whose variant is named anywhere is an E0599 compile error, not a silent
#   downgrade. Removing all but markdown produces 5 of them in `document.rs`.
# * `tree-sitter-json` is not a feature name. JSON comes in via the base
#   `tree-sitter` feature, which every grammar feature below enables, so
#   `Language::Json` still resolves.
# * `tree-sitter-make` is here for `a_file_with_no_grammar_falls_back_to_plain`,
#   which asserts a `Makefile` maps to `Language::Make`. Dropping it is a test
#   failure, not a silent loss.
#
# Adding a grammar is one line. A fence language absent from this list falls
# back to `Language::Plain` at runtime — no highlighting, never a wrong grammar
# and never a panic (`SyntaxHighlighter::new` logs and builds an inert
# highlighter). `tree-sitter-tsx` is the one addition that costs 0 bytes: it
# reuses the `tree-sitter-typescript` parse table already compiled in.
# This is the first upstream revision that limits `gpui/profiler` to gpui-fps.
# Older revisions enabled it workspace-wide, so downstream release builds could
# not disable the profiler even with `default-features = false`.
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "7885c41663c7a6cc68ad0c99b1ba33550f807ff0", features = [
    # Markdown itself, plus the inline grammar it needs. One feature, two variants.
    "tree-sitter-markdown",
    # The rest are fence languages, ordered by how often they appear in one.
    "tree-sitter-rust",
    "tree-sitter-bash",
    "tree-sitter-toml",
    "tree-sitter-yaml",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-html",
    "tree-sitter-css",
    # Not a fence language: `a_file_with_no_grammar_falls_back_to_plain` names
    # `Language::Make`, and the variant only exists with this feature on.
    "tree-sitter-make",
] }
# Already in the graph through gpui-component. The styled Button has no
# independent accessible-name API for icon-only commands at this revision, so
# the workspace chrome composes the Base behavior with the same theme tokens.
gpui-base = { git = "https://github.com/longbridge/gpui-component", rev = "7885c41663c7a6cc68ad0c99b1ba33550f807ff0" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "7885c41663c7a6cc68ad0c99b1ba33550f807ff0" }
gpui-wry = { git = "https://github.com/longbridge/gpui-component", rev = "7885c41663c7a6cc68ad0c99b1ba33550f807ff0" }
# GPUI's X11 window icon is an `image::RgbaImage`. Keep only PNG decoding: the
# icon is the one place markturbo names this already-transitive crate directly.
image = { version = "0.25", default-features = false, features = ["png"] }

anyhow = "1"
env_logger = "0.11"
log = "0.4"
# Already in the graph via gpui-component; naming it here costs no extra
# compilation and closes the data-loss path where a legacy-encoded document
# was decoded lossily and saved back as U+FFFD.
encoding_rs = "0.8"
# Its detector half. Same author as encoding_rs — this is Firefox's own
# detector, and it is only consulted for bytes that are not valid UTF-8.
chardetng = "1"
d2-little = "0.7.1-1"
markdown = "1.0"
# LaTeX math. RaTeX minus its own SVG emitter: `ratex-svg` is the natural
# dependency and is deliberately absent, because the only way to get `<path>`
# rather than `<text>` out of it is its `standalone` feature — and `standalone`
# reaches `ratex-unicode-font` through two independent edges, a direct optional
# dep and a non-optional dep of `ratex-font-loader`. No feature combination
# avoids it. That crate prints past the `log` crate with `eprintln!`, hardcodes
# five distro font paths, and reads a system CJK font it never frees: measured
# 4.5MB -> 52.0MB resident on the first CJK glyph, retained for the process.
#
# Emitting the SVG here instead is ~250 lines in `renderer.rs` and deletes all
# three at the source. Measured after: 4.34MB baseline, 4.55MB after 1000 CJK
# renders, zero stderr lines, no platform font path in the binary.
ratex-parser = "=0.1.14"
ratex-layout = "=0.1.14"
ratex-types = "=0.1.14"
ratex-font = "=0.1.14"
# Reads the KaTeX `.ttf` files and yields glyph outlines. `FontRef` borrows the
# bytes rather than copying them, so a 17.7MB face costs 0.02MB to parse.
ab_glyph = "0.2"
mermaid-svg = "0.7"
notify = "8"
notify-debouncer-full = "0.6"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"
serde_yaml = "0.9"
# The settings format. TOML rather than JSON because a settings file is meant to
# be hand-edited: it takes comments, which JSON cannot, and it does not punish a
# trailing comma. Already in the native tree via gpui-component, so naming it
# costs no extra compilation.
toml = "0.8"
# The platform's own configuration directory. Replaces four hand-rolled
# branches, one of which was wrong: macOS is not an XDG platform, and a file in
# ~/.config there is invisible to every macOS convention for finding it.
dirs = "6"
wry = { version = "0.53.3", package = "lb-wry" }
smol = "2"
tempfile = "3"
# Wry owns WebView2, but it does not expose the private WS_CHILD host or the
# STA thread-message pump needed to keep that host inside GPUI's one window.
# This is a target-gated capability dependency, not a size/performance trade.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# The translation transport. Pulls reqwest and its stack — 41 crates that were
# not compiled before, measured on x86_64-pc-windows-msvc (510 -> 551). tokio
# and hyper are among them: gpui-component-assets declares reqwest only under
# `cfg(target_family = "wasm")`, so none of it built on a desktop target.
# `cargo tree --target all` folds that wasm branch in and reports a smaller
# delta; it is not the number you ship.
#
# `default-features = false` to escape `rustls-tls`, which selects `aws-lc-rs`
# and therefore `aws-lc-sys` — a C library needing cmake and nasm. The two
# entries below put the same TLS back in pure Rust; measured, that removes every
# `aws-lc` crate from the graph.
genai = { version = "0.6.5", default-features = false }
# Not used directly: this is genai's transport, named here only to choose its
# TLS. `rustls-no-provider` is the feature that does not pick a crypto backend.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "json",
    "stream",
    "gzip",
    "charset",
] }
# The backend `rustls-no-provider` declines to choose. `ring` is pure Rust.
#
# The cost of choosing here rather than letting reqwest choose: nothing installs
# a default provider, so `install_default` has to run before the first client is
# built. That failure is a runtime panic on the first translation, not a compile
# error — see `translate::transport`.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
# genai is async-only and its transport is reqwest, which needs a tokio reactor
# running. `rt-multi-thread` rather than `rt`: a current_thread runtime can only
# be driven by whichever thread calls block_on, and gpui hands each
# background_spawn an arbitrary pool thread. Nothing else in the app is async.
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "net",
    "time",
] }

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[patch.crates-io]
# `ratex-parser` 0.1.14 plus one 25-line clamp. `\begin{alignat}{N}` allocates
# `N * 2` 64-byte `AlignSpec` values with no bound, so a 45-byte document
# requests 68GB and dies with an allocation abort — the one failure class
# `catch_unwind` below cannot contain.
#
# The clamp has to be inside the parser rather than in `MathRenderer`: a guard
# over the source text was tried and cannot work, because the parser
# macro-expands before reading the argument. `\begin {alignat}{1e9}` with a
# space, a comment between the two, `\def\N{1000000000}...{\N}`, and a
# macro-supplied environment name all defeat a prefilter, and a prefilter also
# rejects `\begin{cases}{-1} & x<0`, which is ordinary LaTeX.
#
# Delete this stanza and `vendor/ratex-parser` once a release carries the clamp.
# See vendor/ratex-parser/README.markturbo.md.
ratex-parser = { path = "vendor/ratex-parser" }

[profile.dev.package]
# Rendering / layout hot paths are unusable in debug builds otherwise.
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
gpui = { opt-level = 3 }
gpui_platform = { opt-level = 3 }

[profile.release]
# `debug = false` alone leaves the symbols in; `strip` is what actually removes
# them, and it takes ~30MB off the binary.
strip = "symbols"
# One codegen unit lets LLVM inline across the whole crate. Slower to build,
# and worth it here because the parse/render paths are the bottleneck.
codegen-units = 1
# `thin`, not `fat`. Measured rather than assumed: `fat` produces a 53,003,264
# byte binary against `thin`'s 54,269,952 — 1.2MB, 2.3% — and takes 15m24s to
# link against 5m21s. Tripling the build for 2% is not a trade worth making,
# and recording it here is what stops the experiment being re-run.
lto = "thin"
# REQUIRED, not a default: the renderer registry wraps third-party renderers in
# `catch_unwind` so a panic in a diagram backend becomes an inline diagnostic
# instead of killing the app. `panic = "abort"` would silently defeat that.
panic = "unwind"
