name: Release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_ASSET: markturbo-windows-x64.exe

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify tag belongs to the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ -z "$DEFAULT_BRANCH" ]]; then
            echo "error: GitHub did not provide the repository default branch" >&2
            exit 1
          fi

          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          tag_commit="$(git rev-parse --verify "$RELEASE_TAG^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" "origin/$DEFAULT_BRANCH"; then
            echo "error: tag $RELEASE_TAG is not contained in origin/$DEFAULT_BRANCH" >&2
            exit 1
          fi

      - name: Verify tag version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "error: tag $RELEASE_TAG does not match Cargo version $version" >&2
            exit 1
          fi

  build:
    needs: contract
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            scripts/pyproject.toml
            scripts/uv.lock

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: markturbo-windows

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Check
        run: uv run --project scripts scripts/mt.py check full

      - name: Stage executable
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -LiteralPath target\release\markturbo.exe -Destination "release\$env:RELEASE_ASSET"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: markturbo-windows-x64
          if-no-files-found: error
          compression-level: 0
          path: release/${{ env.RELEASE_ASSET }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: markturbo-windows-x64
          path: release

      - name: Publish executable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
          ASSET: release/${{ env.RELEASE_ASSET }}
        run: |
          VERSION="${TAG#v}"
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease --latest=false)
          fi

          if release="$(gh release view "$TAG" --json isDraft,assets)"; then
            is_draft="$(jq -r '.isDraft' <<< "$release")"
            gh release upload "$TAG" "$ASSET" --clobber
            while IFS= read -r asset; do
              if [[ -n "$asset" && "$asset" != "$RELEASE_ASSET" ]]; then
                gh release delete-asset "$TAG" "$asset" --yes
              fi
            done < <(jq -r '.assets[]?.name' <<< "$release")
            if [[ "$is_draft" == "true" ]]; then
              gh release edit "$TAG" --draft=false
            fi
          else
            gh release create "$TAG" "$ASSET" \
              --verify-tag \
              --generate-notes \
              "${prerelease[@]}"
          fi
