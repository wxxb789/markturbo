name: Acceptance executable

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build; defaults to the dispatching ref
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: markturbo-windows
          save-if: false

      - name: Build the release executable
        run: cargo build --release --locked -p mt-app --bin markturbo

      - name: Hash the executable
        id: hash
        env:
          REQUESTED_REF: ${{ inputs.ref || github.ref }}
        run: |
          $commit = (git rev-parse HEAD | Out-String).Trim()
          $short = (git rev-parse --short HEAD | Out-String).Trim()
          $binary = Resolve-Path "target/release/markturbo.exe"
          $directory = Split-Path -Parent $binary
          $name = Split-Path -Leaf $binary
          $size = (Get-Item -LiteralPath $binary).Length
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash.ToLowerInvariant()

          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @(
            "## $name"
            ""
            "| Field | Value |"
            "| --- | --- |"
            "| ref | ``$env:REQUESTED_REF`` |"
            "| commit | ``$commit`` |"
            "| exe | ``$name`` |"
            "| size | $size bytes |"
            "| sha256 | ``$digest`` |"
          )

          $checksum = Join-Path $directory "SHA256SUMS.txt"
          [IO.File]::WriteAllText(
            $checksum,
            "$digest  $name`n# ref: $env:REQUESTED_REF`n# commit: $commit`n# size: $size`n",
            [Text.Encoding]::ASCII
          )

          "short=$short" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: markturbo-exe-${{ steps.hash.outputs.short }}
          if-no-files-found: error
          retention-days: 7
          path: |
            target/release/markturbo.exe
            target/release/SHA256SUMS.txt
