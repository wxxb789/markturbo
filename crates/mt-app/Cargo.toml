[package]
name = "mt-app"
description = "markturbo: a native workspace for Markdown as the human-agent interface."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "mt_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "markturbo"
path = "src/main.rs"

[features]
default = ["model-transport"]
# The public build keeps this default; disabling it is only the compile-time
# upper bound for the model/network closure.
model-transport = ["mt-core/model-transport"]

[dependencies]
mt-core.workspace = true

env_logger.workspace = true
log.workspace = true
markdown.workspace = true
encoding_rs.workspace = true
dirs.workspace = true
rust-embed.workspace = true

nsh-core = "0.4.0"
nsh-base = "0.4.0"

[target.'cfg(target_os = "linux")'.dependencies]
# `webview` links WebKitGTK 6.0; the Web pane is part of the product surface.
nsh-platform-linux = { version = "0.4.0", default-features = false, features = ["webview"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.4.0", default-features = false }

[dev-dependencies]
mt-core = { workspace = true, features = ["test-support"] }
nsh-engine = "0.4.0"
nsh-testing = "0.4.0"
serde_json.workspace = true
tempfile.workspace = true
