[package]
name = "mt-app"
description = "markturbo: a native GPUI workspace for Markdown as the human-agent interface."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "mt_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "markturbo"
path = "src/main.rs"

[dependencies]
mt-doc.workspace = true

anyhow.workspace = true
chardetng.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
log.workspace = true
d2-little.workspace = true
encoding_rs.workspace = true
env_logger.workspace = true
markdown.workspace = true
mathjax-svg-rs.workspace = true
mermaid-svg.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true
tempfile.workspace = true
genai.workspace = true
# Neither is called directly. They are here to pin genai's TLS to pure Rust:
# see the comment on `genai` in the workspace manifest.
reqwest.workspace = true
rustls.workspace = true
tokio.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
gpui-wry.workspace = true
raw-window-handle.workspace = true
wry.workspace = true

[dev-dependencies]
tempfile.workspace = true
