[package]
name = "mt-app"
description = "markturbo: a native workspace for Markdown as the human-agent interface."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "mt_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "markturbo"
path = "src/main.rs"

# All of `tests/*.rs` as one binary, for the nightly release-profile run only
# (see the file header). `test = false` keeps it out of plain `cargo test`.
[[test]]
name = "release_suite"
path = "tests/release_suite.rs"
test = false

[features]
default = ["model-transport"]
# The public build keeps this default; disabling it is only the compile-time
# upper bound for the model/network closure.
model-transport = ["mt-core/model-transport"]
# Test builds only: `AppState::new` uses an in-memory credential store, never
# the platform's. Enabled for integration tests by the dev-dependency on this
# crate below; a release build does not build dev-dependencies.
test-vault = ["mt-core/test-support"]

[dependencies]
mt-core.workspace = true

env_logger.workspace = true
log.workspace = true
tracing.workspace = true
markdown.workspace = true
encoding_rs.workspace = true
dirs.workspace = true
rust-embed.workspace = true

nsh-core = "=0.6.1"
# Only the parts the app uses: the editor and the preview's code highlighting.
# The defaults also compile plot, rich-editor and term, which the app never
# shows but `nsh_base::registry()` links in.
nsh-base = { version = "=0.6.1", default-features = false, features = ["editor", "highlight"] }

[target.'cfg(target_os = "linux")'.dependencies]
# `webview` links WebKitGTK 6.0; the Web pane is part of the product surface.
nsh-platform-linux = { version = "=0.6.1", default-features = false, features = ["webview"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "=0.6.1", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
# WebView2 is used by the preview; the app has no native media surface.
nsh-platform-windows = { version = "=0.6.1", default-features = false, features = ["webview"] }
windows.workspace = true

[dev-dependencies]
mt-app = { path = ".", features = ["test-vault"] }
nsh-engine = "=0.6.1"
nsh-testing = "=0.6.1"
serde_json.workspace = true
tempfile.workspace = true
