[package]
name = "mt-app"
description = "markturbo: a native GPUI workspace for Markdown as the human-agent interface."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "mt_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "markturbo"
path = "src/main.rs"

[[bin]]
name = "markturbo-gpui-shell"
path = "src/bin/markturbo-gpui-shell.rs"

[features]
default = ["model-transport"]
# Goal 04 measurement apparatus. The public build keeps this default; disabling
# it is only the compile-time upper bound for the model/network closure.
model-transport = ["mt-core/model-transport"]
profiler = ["gpui-kit/profiler"]

[dependencies]
mt-core.workspace = true

anyhow.workspace = true
dirs.workspace = true
gpui.workspace = true
gpui-kit.workspace = true
log.workspace = true
tracing.workspace = true
encoding_rs.workspace = true
env_logger.workspace = true
markdown.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smol.workspace = true
tempfile.workspace = true
toml.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
gpui-wry.workspace = true
raw-window-handle.workspace = true
wry.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com.workspace = true
windows.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
image.workspace = true

[build-dependencies]
# Embeds the multi-resolution icon in the Windows PE. The crate is already in
# the GPUI graph; naming it here makes the resource part of this binary.
embed-resource = "3"

[dev-dependencies]
image.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
mt-core = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
